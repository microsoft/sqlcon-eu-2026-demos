# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: caldova-evidence-hosted
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                  format: OpenAI
                  name: gpt-5
                  version: "2025-08-07"
              name: gpt-5
              sku:
                  capacity: 1000
                  name: GlobalStandard
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
    caldova-evidence-hosted:
        project: src/foundry-toolbox-mcp-skills
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            SKILL_NAMES: ${SKILL_NAMES}
            SQL_MCP_ENDPOINT: ${SQL_MCP_ENDPOINT}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: CaldovaEvidenceHostedAgent.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: "Hosted biomedical evidence agent that progressively loads a Foundry Agent Skill and investigates through governed Azure SQL MCP tools."
        displayName: Caldova Evidence Agent (Hosted)
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Agent Framework
                - Agent Skills
                - MCP
                - Azure SQL
                - Data API builder
                - .NET
        name: caldova-evidence-hosted
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
